# Основні режими роботи драйвера
# 'LCD_MODE_I2C' або 'LCD_MODE_GPIO'
# 'builtin' (апаратний) або 'virtual' (віртуальний i2c-gpio)
# Номер пристрою (/dev/hd44780.0) або апаратної шини i2c-0
# Шістнадцяткова адреса PCF8574 (0x27 або 0x3F)

config display 'pins'
	option lcd_mode_dev 'LCD_MODE_I2C'
	option i2c_bus_type 'builtin'
	option dev '0'
	option address '0x27'
	option sda_gpio '20'
	option scl_gpio '21'
	option hd_rs '0'
	option hd_rw '1'
	option hd_e '2'
	option hd_db4 '3'
	option hd_db5 '15'
	option hd_db6 '16'
	option hd_db7 '14'
	option enabled '0'
