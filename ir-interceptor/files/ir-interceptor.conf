# =================================================================
# НАЛАШТУВАННЯ ТАЙМАУТІВ ТА МАРКЕРІВ (Вбудований Failsafe захист)
# =================================================================
SET DEBOUNCE_PRESS   200      # Затримка кліку (у мілісекундах)
SET DEBOUNCE_HOLD    800      # Затримка утримання кнопки (у мілісекундах)
SET CH_TIMEOUT       500      # Таймаут очікування наступної цифри каналу (в мс)
SET NUM_PREFIX       NUM_     # Префікс для збору цифрових кнопок
SET CH_PREFIX        CH       # Префікс для результату каналів

# Список пристроїв без "/dev/input/". Якщо закоментувати — увімкнеться автоскан
SET DEVICE           event0
SET DEVICE           event1
SET DEVICE           event2

# =================================================================
# СЕКЦІЯ 1: ФІЗИЧНІ КНОПКИ, GPIO ТА ЕНКОДЕР (Групування пульт+клавіатура)
# =================================================================
# Маркер       Код(Список через кому в ` `)  Стан    Системна команда

# Сирі коди цифр пульта та клавіатури для накопичення в єдиний буфер
NUM_0	`11,0xbf03,0x80ff00`		1
NUM_1	`2,0xbf17,0x80ff01`		1
NUM_2	`3,0xbf12,0x80ff02`		1
NUM_3	`4,0xbf59,0x80ff03`		1
NUM_4	`5,0xbf50,0x80ff04`		1
NUM_5	`6,0xbf55,0x80ff05`		1
NUM_6	`7,0xbf48,0x80ff06`		1
NUM_7	`8,0xbf5e,0x80ff07`		1
NUM_8	`9,0xbf06,0x80ff08`		1
NUM_9	`10,0xbf05,0x80ff09`		1

# Керування живленням (Об'єднані пульти та кнопка 116)
KEY_POWER	`116,0x80ff12,0xbf14`		1	/etc/init.d/web-radio2.init start

# Керування звуком MUTE
KEY_MUTE	`99,0x80ff16,0xbf46`		1	tda7313 volume 0; QUERY_STRING=act=mute /www/cgi-bin/modules/web-radio2/volume.cgi;h

# Керування гучністю UP
KEY_VOLUMEUP	`1,115,0x80ff13,0xbf0a`		1	QUERY_STRING="act=up" /www/cgi-bin/modules/web-radio2/volume.cgi
KEY_VOLUMEUP	`115,0x80ff13,0xbf0a`		2	tda7313 volume +

# Керування гучністю DOWN
KEY_VOLUMEDOWN	`-1,114,0x80ff17,0xbf53`	1	QUERY_STRING="act=down" /www/cgi-bin/modules/web-radio2/volume.cgi
KEY_VOLUMEDOWN	`114,0x80ff17,0xbf53`		2	tda7313 volume -

# Перемикання каналів UP/DOWN
KEY_CHANNELUP	`402,0x80ff10,0xbf11`		1	/etc/init.d/web-radio2.init reload 0
KEY_CHANNELDOWN	`403,0x80ff14,0xbf19`		1	/etc/init.d/web-radio2.init reload 13

# Кнопка підтвердження OK
KEY_OK		`0x80ff0e,0xbf51`		1	/etc/init.d/web-radio2.init reload 15

# Специфічні кнопки другого ІР-пульта (Для аудіопроцесора TDA7313)
KEY_TUNER	0xbf44				1	tda7313 lound +
BTN_RIGHT	0xbf1a				1	tda7313 streble +
BTN_RIGHT	0xbf1a				2	tda7313 streble +
BTN_LEFT	0xbf45				1	tda7313 streble -
BTN_LEFT	0xbf45				2	tda7313 streble 0

KEY_PAGEUP	0xbf09				1	tda7313 init
KEY_PAGEDOWN	0xbf4a				1	tda7313 treble -
KEY_PAGEDOWN	0xbf4a				2	tda7313 treble 0

BTN_PINKIE	0xbf08				1	tda7313 treble +
BTN_PINKIE	0xbf08				2	tda7313 treble +
BTN_BASE	0xbf18				2	tda7313 sbass 0

KEY_RIGHT_DOWN	0xbf1e				1	tda7313 sbass +
KEY_RIGHT_DOWN	0xbf1e				2	tda7313 sbass +
KEY_RIGHT_UP	0xbf52				1	tda7313 sbass -
KEY_RIGHT_UP	0xbf52				2	tda7313 sbass 0

KEY_KBDINPUTASSIST_PREV		0xbf1d		1	tda7313 input 1
KEY_KBDINPUTASSIST_NEXT		0xbf1f		1	tda7313 input 0
KEY_KBDINPUTASSIST_PREVGROUP	0xbf0d		1	tda7313 input 2

# =================================================================
# СЕКЦІЯ 2: ВІРТУАЛЬНІ БАГАТОЗНАЧНІ КАНАЛИ (Універсальний Шаблон)
# =================================================================
# Програма сама приклеїть номер каналу з буфера до кінця цієї команди

CH		1	/etc/init.d/web-radio2.init reload 

# =================================================================
# СЕКЦІЯ 3: ФІЗИЧНІ КНОПКИ, GPIO ТА ЕНКОДЕР
# =================================================================
# Маркер       Код          Стан    Системна команда

# Кнопка NUMs_volup (gpios = PA16, linux,code = 115)
VOL_UP         115          1       volume +1
VOL_UP         115          2       volume +2

# Кнопка NUMs_voldown (gpios = PA15, linux,code = 114)
VOL_DOWN       114          1       volume -1
VOL_DOWN       114          2       volume -2

# Кнопка NUMs_power (gpios = PA14, linux,code = 116)
SYS_PWR        116          1       poweroff

# Кнопка NUMs_chanup (gpios = PA13, linux,code = 402)
CH_UP          402          1       mpc next

# Кнопка NUMs_chandown (gpios = PA2, linux,code = 403)
CH_DOWN        403          1       mpc prev
